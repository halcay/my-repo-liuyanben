<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聊天室</title>
<style>
  :root{--bg:#f3f4f6;--card:#fff;--fg:#111827;--mute:#6b7280;--line:#e5e7eb;--pri:#16a34a;--me:#95ec69;--me-fg:#111;--other:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--fg:#e5e7eb;--mute:#8b93a1;--line:#2a2f38;--pri:#22c55e;--me:#2f7d32;--me-fg:#f0fff0;--other:#262a31}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  input,textarea,button{font:inherit}
  input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
  button{padding:10px 18px;border:0;border-radius:10px;background:var(--pri);color:#fff;cursor:pointer;font-size:15px}
  button.gray{background:transparent;color:var(--mute);border:1px solid var(--line);padding:6px 12px;font-size:13px}
  button:disabled{opacity:.5}

  /* 进入房间 */
  #join{max-width:380px;margin:0 auto;padding:12vh 20px 20px}
  #join h1{text-align:center;font-size:26px;margin:0 0 6px}
  #join p.sub{text-align:center;color:var(--mute);margin:0 0 26px;font-size:14px}
  #join label{display:block;font-size:13px;color:var(--mute);margin:14px 0 5px}
  #join button{width:100%;margin-top:22px;padding:12px}
  #joinErr{color:#dc2626;font-size:14px;margin-top:12px;text-align:center;min-height:20px}
  .back{display:block;text-align:center;margin-top:18px;color:var(--mute);font-size:13px;text-decoration:none}

  /* 聊天界面 */
  #chat{display:none;height:100%;flex-direction:column;max-width:860px;margin:0 auto;background:var(--bg)}
  body.in #join{display:none} body.in #chat{display:flex}
  .top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
  .top h2{margin:0;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top h2 small{font-weight:400;color:var(--mute);font-size:13px;margin-left:6px}
  .dot{width:9px;height:9px;border-radius:50%;background:#9ca3af;flex:none}
  .dot.on{background:var(--pri)} .dot.wait{background:#f59e0b}
  #online{font-size:12.5px;color:var(--mute);padding:6px 14px;background:var(--card);border-bottom:1px solid var(--line);white-space:nowrap;overflow:auto}
  #list{flex:1;overflow-y:auto;padding:14px 12px 6px}
  .sys{text-align:center;font-size:12px;color:var(--mute);margin:10px 0}
  .m{display:flex;flex-direction:column;align-items:flex-start;margin:8px 0}
  .m .who{font-size:12px;color:var(--mute);margin:0 4px 3px}
  .m .bub{max-width:78%;padding:9px 12px;border-radius:12px;background:var(--other);white-space:pre-wrap;word-break:break-word;line-height:1.55;
    box-shadow:0 1px 1px #0000000d}
  .m.me{align-items:flex-end}
  .m.me .bub{background:var(--me);color:var(--me-fg)}
  .m .bub a{color:inherit}
  #typing{height:20px;font-size:12px;color:var(--mute);padding:0 16px}
  .send{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
  .send textarea{resize:none;height:44px;max-height:140px;line-height:1.45}
</style>
</head>
<body>

<section id="join">
  <h1>💬 聊天室</h1>
  <p class="sub">打开这个页面的人都在同一个聊天室，消息秒到</p>
  <label for="nick">你的昵称</label>
  <input id="nick" maxlength="20" placeholder="例如：小王">
  <button id="joinBtn">进入房间</button>
  <div id="joinErr"></div>
  <a class="back" href="/">← 返回首页</a>
</section>

<section id="chat">
  <div class="top">
    <span class="dot" id="dot"></span>
    <h2 id="roomTitle"></h2>
    <button class="gray" id="shareBtn">邀请</button>
    <button class="gray" id="leaveBtn">退出</button>
  </div>
  <div id="online"></div>
  <div id="list"></div>
  <div id="typing"></div>
  <div class="send">
    <textarea id="input" maxlength="2000" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="sendBtn">发送</button>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 消息里的网址变成可点链接
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const cleanRoom = v => String(v || '').replace(/[^\w一-龥-]/g, '').slice(0, 40);
const fmtT = t => { const d = new Date(t), now = new Date();
  const hm = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
  return d.toDateString() === now.toDateString() ? hm : d.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' }) + ' ' + hm; };
const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

// 只有一个公共聊天室；记住昵称，下次直接进
const ROOM = 'main';
$('nick').value = store.get('chatNick');
$('nick').focus();

let ws, me = '', room = ROOM, pass = '', retry = 0, retryTimer, pingTimer, wantOpen = false, lastTime = 0;

function setDot(s) { $('dot').className = 'dot ' + s; }
function sys(t) { $('list').insertAdjacentHTML('beforeend', `<div class="sys">${esc(t)}</div>`); scrollEnd(); }
function scrollEnd(force) {
  const l = $('list');
  if (force || l.scrollHeight - l.scrollTop - l.clientHeight < 160) l.scrollTop = l.scrollHeight;
}
function addMsg(m, force) {
  // 相隔 5 分钟以上插一条时间
  if (m.time - lastTime > 5 * 60 * 1000) $('list').insertAdjacentHTML('beforeend', `<div class="sys">${fmtT(m.time)}</div>`);
  lastTime = m.time;
  const mine = m.name === me;
  $('list').insertAdjacentHTML('beforeend',
    `<div class="m ${mine ? 'me' : ''}">${mine ? '' : `<div class="who">${esc(m.name)}</div>`}<div class="bub">${linkify(m.text)}</div></div>`);
  scrollEnd(force || mine);
}
function showOnline(list) {
  const uniq = [...new Set(list || [])];
  $('online').textContent = `在线 ${uniq.length} 人：` + uniq.join('、');
}

// ---------- 未读提示：页面在后台时标题闪烁 ----------
let unread = 0;
const baseTitle = () => '聊天室';
document.addEventListener('visibilitychange', () => { if (!document.hidden) { unread = 0; document.title = baseTitle(); } });
function notify() { if (!document.hidden) return; unread++; document.title = `(${unread}) ${baseTitle()}`; }

// ---------- 连接 ----------
function connect() {
  clearTimeout(retryTimer);
  setDot('wait');
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const u = `${proto}://${location.host}/api/chat/${encodeURIComponent(room)}?name=${encodeURIComponent(me)}&pass=${encodeURIComponent(pass)}`;
  ws = new WebSocket(u);
  let gotHello = false;
  ws.onmessage = e => {
    if (e.data === 'pong') return;
    let d; try { d = JSON.parse(e.data); } catch (err) { return; }
    if (d.type === 'error') { wantOpen = false; leave(d.text); return; }
    if (d.type === 'hello') {
      gotHello = true; retry = 0; setDot('on');
      $('list').innerHTML = ''; lastTime = 0;
      if (!d.msgs.length) sys('还没有消息，把“邀请”链接发给对方吧');
      d.msgs.forEach(m => addMsg(m));
      scrollEnd(true);
      $('roomTitle').textContent = '聊天室';
      return;
    }
    if (d.type === 'msg') { addMsg(d); if (d.name !== me) notify(); typingOff(d.name); }
    else if (d.type === 'join') { showOnline(d.online); if (d.name !== me) sys(`${d.name} 进入了房间`); }
    else if (d.type === 'leave') { showOnline(d.online); sys(`${d.name} 离开了`); typingOff(d.name); }
    else if (d.type === 'typing') typingOn(d.name);
  };
  ws.onopen = () => {
    clearInterval(pingTimer);
    pingTimer = setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 25000);
  };
  ws.onclose = () => {
    clearInterval(pingTimer);
    setDot('');
    if (!wantOpen) return;
    // 断线自动重连：1s、2s、4s… 最长 15s
    const wait = Math.min(15000, 1000 * 2 ** retry++);
    if (gotHello || retry === 1) sys(`连接断开，${Math.round(wait / 1000)} 秒后重连…`);
    retryTimer = setTimeout(connect, wait);
  };
}

function enter() {
  me = $('nick').value.trim().slice(0, 20);
  if (!me) { $('joinErr').textContent = '请填写昵称'; return $('nick').focus(); }
  $('joinErr').textContent = '';
  store.set('chatNick', me);
  document.body.classList.add('in');
  $('roomTitle').textContent = '聊天室';
  document.title = baseTitle();
  $('list').innerHTML = ''; $('online').textContent = '';
  wantOpen = true; retry = 0;
  connect();
  $('input').focus();
}
function leave(err) {
  wantOpen = false;
  clearTimeout(retryTimer); clearInterval(pingTimer);
  try { ws && ws.close(); } catch (e) {}
  document.body.classList.remove('in');
  document.title = '聊天室';
  $('joinErr').textContent = err || '';
}
$('joinBtn').onclick = enter;
['nick'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') enter(); }));
$('leaveBtn').onclick = () => leave();

// ---------- 发送 ----------
function send() {
  const text = $('input').value.trim();
  if (!text) return;
  if (!ws || ws.readyState !== 1) { sys('还没连上，稍等一下再发'); return; }
  ws.send(JSON.stringify({ type: 'msg', text }));
  $('input').value = ''; autoGrow();
}
$('sendBtn').onclick = send;
let lastTyping = 0;
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); return; }
});
$('input').addEventListener('input', () => {
  autoGrow();
  if (ws && ws.readyState === 1 && Date.now() - lastTyping > 2500) { lastTyping = Date.now(); ws.send(JSON.stringify({ type: 'typing' })); }
});
function autoGrow() { const t = $('input'); t.style.height = '44px'; t.style.height = Math.min(140, t.scrollHeight + 2) + 'px'; }

// ---------- “正在输入” ----------
const typers = {};
function renderTyping() { const n = Object.keys(typers); $('typing').textContent = n.length ? `${n.join('、')} 正在输入…` : ''; }
function typingOn(n) { clearTimeout(typers[n]); typers[n] = setTimeout(() => typingOff(n), 4000); renderTyping(); }
function typingOff(n) { if (typers[n]) { clearTimeout(typers[n]); delete typers[n]; renderTyping(); } }

// ---------- 邀请链接（不含密码，密码要单独告诉对方） ----------
$('shareBtn').onclick = async () => {
  const u = `${location.origin}/chat.html`;
  try { await navigator.clipboard.writeText(u); sys('已复制邀请链接：' + u); }
  catch (e) { prompt('复制这个链接发给对方：', u); }
};
</script>
</body>
</html>
