<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文件</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--fg:#1f2937;--mute:#6b7280;--line:#e5e7eb;--pri:#2563eb;--red:#dc2626}
  @media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--fg:#e2e8f0;--mute:#94a3b8;--line:#334155;--pri:#60a5fa;--red:#f87171}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg)}
  header{max-width:860px;margin:0 auto;padding:24px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:24px;flex:1}
  header a{color:var(--pri);font-size:14px}
  main{max-width:860px;margin:16px auto 0;padding:0 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
  input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  textarea{min-height:90px;resize:vertical}
  .btn{padding:9px 20px;border:0;border-radius:8px;background:var(--pri);color:#fff;font-size:15px;cursor:pointer}
  .btn:disabled{opacity:.5}
  .del{border:0;background:none;color:var(--red);cursor:pointer;font-size:13px;display:none}
  body.admin .del{display:inline}
  .row{display:flex;gap:10px;margin-bottom:10px}
  .msg{padding:12px 0;border-bottom:1px solid var(--line)}
  .msg b{color:var(--pri)} .msg small{color:var(--mute);margin-left:8px}
  .msg p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
  #drop{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;cursor:pointer;color:var(--mute)}
  #drop.over{border-color:var(--pri);color:var(--pri)}
  .file{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .file a{flex:1;color:var(--fg);word-break:break-all;text-decoration:none}
  .file a:hover{color:var(--pri)}
  .file small{color:var(--mute);white-space:nowrap}
  #status{margin:10px 0;color:var(--mute);font-size:14px;min-height:20px}
  .empty{color:var(--mute);padding:16px 0;text-align:center}
  .view{border:1px solid var(--pri);background:none;color:var(--pri);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
  #pv{position:fixed;inset:0;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:9}
  #pv[hidden]{display:none}
  #pvBody{max-width:100%;max-height:85vh;display:flex;justify-content:center}
  #pvBody img,#pvBody video{max-width:100%;max-height:85vh;border-radius:8px;background:#000}
  #pvBody audio{width:min(90vw,520px)}
  #pvBody iframe{width:min(92vw,900px);height:85vh;border:0;border-radius:8px;background:#fff}
  #pvBar{color:#fff;margin-top:10px;display:flex;gap:16px;align-items:center;font-size:14px;max-width:92vw}
  #pvBar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #pvBar a,#pvBar button{color:#93c5fd;background:none;border:0;cursor:pointer;font-size:14px;white-space:nowrap}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .crumb{flex:1;font-size:15px;min-width:0}
  .crumb a{color:var(--pri);text-decoration:none;cursor:pointer}
  .crumb b{font-weight:600}
  .sbtn{padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer;font-size:14px}
  .sbtn:hover{border-color:var(--pri);color:var(--pri)}
  .dirs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:16px 0 6px}
  .dir{position:relative;display:flex;flex-direction:column;justify-content:space-between;height:96px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;transition:border-color .15s}
  .dir:hover{border-color:var(--pri)}
  .dir .dn{display:flex;align-items:center;gap:8px;font-weight:600;word-break:break-all}
  .dir .dn svg{flex:none;width:20px;height:20px;color:#d4a017}
  .dir small{color:var(--mute);font-size:12px}
  .dir .ddel{position:absolute;top:8px;right:8px;display:none;border:0;background:none;color:var(--red);cursor:pointer;font-size:16px;line-height:1}
  body.admin .dir .ddel{display:block}
  .sub{font-size:13px;color:var(--mute);margin:18px 0 0}
</style>
</head>
<body>
<header>
  <h1>📁 文件</h1>
  <a href="/">首页</a>
  <a href="/player.html" onclick="this.href='/player.html?folder='+encodeURIComponent(curDir())">播放器</a>
  <a href="#" id="adminBtn">管理</a>
</header>
<main>
  <section id="t-file" class="card">
    <div class="bar">
      <div class="crumb" id="crumb"></div>
      <button class="sbtn" id="newDir">＋ 新建文件夹</button>
      <button class="sbtn" id="upDir">上传文件夹</button>
    </div>
    <div id="drop">点击或拖拽文件到这里上传</div>
    <input id="fi" type="file" multiple hidden>
    <input id="fd" type="file" webkitdirectory multiple hidden>
    <progress id="prog" max="100" value="0" hidden style="width:100%;height:10px;margin-top:10px"></progress>
    <button id="cancelUp" hidden style="margin-top:6px;padding:4px 14px;border:0;border-radius:6px;background:#dc2626;color:#fff;cursor:pointer">取消上传</button>
    <div id="status"></div>
    <div id="dirs" class="dirs"></div>
    <div id="files"></div>
  </section>
</main>

<div id="pv" hidden>
  <div id="pvBody"></div>
  <div id="pvBar"><span id="pvName"></span><a id="pvDl" download>下载</a><button id="pvClose">关闭 ✕</button></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT = t => new Date(t).toLocaleString('zh-CN', { hour12: false });
const fmtS = n => n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : (n/1048576).toFixed(1) + ' MB';
let adminKey = '';
try { adminKey = sessionStorage.getItem('adminKey') || ''; } catch (e) {}
if (adminKey) document.body.classList.add('admin');

async function api(path, opt = {}) {
  opt.headers = { ...(opt.headers || {}), ...(adminKey ? { 'x-admin-key': adminKey } : {}) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ error: r.status + ' ' + r.statusText }));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

// 管理模式
$('adminBtn').onclick = async e => {
  e.preventDefault();
  if (adminKey) { adminKey = ''; try { sessionStorage.removeItem('adminKey'); } catch (e) {} document.body.classList.remove('admin'); reload(); return; }
  const k = prompt('输入管理密钥（开启删除按钮）');
  if (!k) return;
  adminKey = k;
  try { await api('/api/admin'); }
  catch (err) { adminKey = ''; alert(err.message); return; }
  try { sessionStorage.setItem('adminKey', k); } catch (e) {}
  document.body.classList.add('admin');
  reload();
};

// ---------- 文件 ----------
// 判断能否在线预览：图片 / 视频 / 音频 / PDF / 文本
function kind(f) {
  const t = (f.type || '').toLowerCase(), n = (f.name || '').toLowerCase();
  if (/^image\/(png|jpe?g|gif|webp|avif|bmp)$/.test(t) || /\.(png|jpe?g|gif|webp|avif|bmp)$/.test(n)) return 'image';
  if (t.startsWith('video/') || /\.(mp4|webm|mov|m4v|ogv)$/.test(n)) return 'video';
  if (t.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|aac|flac)$/.test(n)) return 'audio';
  if (t === 'application/pdf' || n.endsWith('.pdf')) return 'pdf';
  if (t === 'text/plain' || /\.(txt|log|md|csv)$/.test(n)) return 'text';
  if (/\.(docx?|rtf)$/.test(n)) return 'word';
  if (/\.(xlsx?|xlsm)$/.test(n)) return 'excel';
  if (/\.(pptx?|ppsx?)$/.test(n)) return 'ppt';
  return '';
}
const icon = k => ({ image: '🖼️', video: '🎬', audio: '🎵', pdf: '📕', text: '📝', word: '📘', excel: '📗', ppt: '📙' }[k] || '📄');
const isOffice = k => k === 'word' || k === 'excel' || k === 'ppt';
// Office 文件用微软在线查看器打开：它需要能从公网访问的文件地址，文件会被微软服务器读取
const OFFICE_LIMIT = { word: 10, ppt: 10, excel: 5 };   // MB，超过微软查看器会打不开
function preview(f) {
  const src = `/api/files/${encodeURIComponent(f.id)}?view=1`, k = kind(f);
  const officeSrc = 'https://view.officeapps.live.com/op/embed.aspx?src=' +
    encodeURIComponent(location.origin + `/api/files/${encodeURIComponent(f.id)}`);
  const tooBig = isOffice(k) && (f.size || 0) > OFFICE_LIMIT[k] * 1048576;
  const el = isOffice(k)
    ? (tooBig ? `<div style="padding:40px;text-align:center;color:#999">文件超过 ${OFFICE_LIMIT[k]}MB，微软在线查看器打不开，请下载后查看</div>`
              : `<iframe src="${officeSrc}" style="background:#fff"></iframe>`)
    : k === 'image' ? `<img src="${src}" alt="">`
    : k === 'video' ? `<video src="${src}" controls autoplay playsinline></video>`
    : k === 'audio' ? `<audio src="${src}" controls autoplay></audio>`
    : `<iframe src="${src}"></iframe>`;
  $('pvBody').innerHTML = el;
  $('pvName').textContent = f.name;
  $('pvDl').href = `/api/files/${encodeURIComponent(f.id)}`;
  $('pv').hidden = false;
  const v = $('pvBody').querySelector('video');
  if (v) v.onerror = () => { $('pvName').textContent = f.name + '（此设备可能不支持该视频格式，请下载后观看）'; };
}
function closePv() { $('pv').hidden = true; $('pvBody').innerHTML = ''; }
$('pvClose').onclick = closePv;
$('pv').onclick = e => { if (e.target.id === 'pv') closePv(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('pv').hidden) closePv(); });

// ---------- 文件夹 ----------
// 当前所在文件夹，记在网址 #/文件夹名 里，刷新或分享链接都能回到这里
const curDir = () => { try { return decodeURIComponent(location.hash.replace(/^#\/?/, '')); } catch (e) { return ''; } };
const goDir = d => { location.hash = d ? '/' + encodeURIComponent(d) : ''; };
window.addEventListener('hashchange', () => reload());
const DIR_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
const cleanName = v => String(v || '').replace(/[\\/]/g, '').trim().slice(0, 40);

function renderBar() {
  const d = curDir();
  $('crumb').innerHTML = d ? `<a id="toRoot">全部文件</a> › <b>${esc(d)}</b>` : '<b>全部文件</b>';
  if (d) $('toRoot').onclick = () => goDir('');
  $('newDir').hidden = !!d;
  $('upDir').hidden = !!d || !('webkitdirectory' in document.createElement('input'));
  const lim = maxBig ? `单个最大 ${maxFile / 1048576}MB，管理员可传最大 ${maxBig / 1073741824}GB` : `单个最大 ${maxFile / 1048576}MB`;
  $('drop').textContent = `点击或拖拽文件到这里上传${d ? `到「${d}」` : ''}（${lim}）`;
}

async function loadDirs() {
  if (curDir()) { $('dirs').innerHTML = ''; return; }
  try {
    const list = await api('/api/folders');
    $('dirs').innerHTML = list.map(d => `
      <div class="dir" data-name="${esc(d.name)}">
        <button class="ddel" title="删除空文件夹" data-name="${esc(d.name)}">✕</button>
        <div class="dn">${DIR_SVG}<span>${esc(d.name)}</span></div>
        <small>${d.count} 个文件${d.count ? ' · ' + fmtS(d.size) : ''}</small>
      </div>`).join('');
    $('dirs').querySelectorAll('.dir').forEach(el => el.onclick = () => goDir(el.dataset.name));
    $('dirs').querySelectorAll('.ddel').forEach(b => b.onclick = async e => {
      e.stopPropagation();
      if (!confirm(`删除文件夹「${b.dataset.name}」？`)) return;
      try { await api('/api/folders/' + encodeURIComponent(b.dataset.name), { method: 'DELETE' }); loadDirs(); }
      catch (err) { alert(err.message); }
    });
  } catch (e) { $('dirs').innerHTML = ''; }
}

$('newDir').onclick = async () => {
  const name = cleanName(prompt('新文件夹名称（例如 2025、合同、产品图）'));
  if (!name) return;
  try { await api('/api/folders', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) }); goDir(name); }
  catch (e) { alert(e.message); }
};

async function loadFiles() {
  const d = curDir();
  try {
    const list = await api('/api/files?folder=' + encodeURIComponent(d));
    const head = !d && list.length ? '<div class="sub">未归类的文件</div>' : '';
    $('files').innerHTML = list.length ? head + list.map(f => `
      <div class="file">${icon(kind(f))} <a href="/api/files/${esc(encodeURIComponent(f.id))}" download>${esc(f.name)}</a>
        <small>${fmtS(f.size || 0)} · ${fmtT(f.time)}</small>
        ${kind(f) ? `<button class="view" data-id="${esc(f.id)}">${kind(f) === 'video' || kind(f) === 'audio' ? '播放' : '查看'}</button>` : ''}
        <button class="del" data-id="${esc(f.id)}">删除</button></div>`).join('')
      : (d ? '<div class="empty">这个文件夹还是空的，把文件拖到上面的框里上传</div>' : '');
    $('files').querySelectorAll('.view').forEach(b => b.onclick = () => preview(list.find(f => f.id === b.dataset.id)));
    $('files').querySelectorAll('.del').forEach(b => b.onclick = async () => {
      if (!confirm('删除这个文件？')) return;
      try { await api('/api/files/' + encodeURIComponent(b.dataset.id), { method: 'DELETE' }); reload(); }
      catch (e) { alert(e.message); }
    });
  } catch (e) { $('files').innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; }
}

// 用 XHR 发送，才能拿到实时上传进度（fetch 拿不到）
// 取消上传：中断当前请求，并让后续文件都不再上传
let curXhr = null, cancelled = false;
class Cancelled extends Error { constructor() { super('已取消'); } }
$('cancelUp').onclick = () => {
  if (!confirm('取消上传？已传完的文件会保留，正在传的这个会作废。')) return;
  cancelled = true;
  if (curXhr) curXhr.abort();
};
function xhrSend(method, path, body, onProg) {
  return new Promise((res, rej) => {
    if (cancelled) return rej(new Cancelled());
    const x = new XMLHttpRequest();
    curXhr = x;
    x.onabort = () => rej(new Cancelled());
    x.open(method, path);
    if (adminKey) x.setRequestHeader('x-admin-key', adminKey);
    x.upload.onprogress = e => onProg && onProg(e.loaded);
    x.onload = () => {
      let j; try { j = JSON.parse(x.responseText); } catch (e) { j = { error: x.status + ' ' + x.statusText }; }
      x.status >= 200 && x.status < 300 ? res(j) : rej(new Error(j.error || x.status));
    };
    x.onerror = () => rej(new Error('网络错误'));
    x.send(body);
  });
}
// 进度条 + 文字：已传 / 总量 / 速度 / 剩余时间
function showProg(label, name, done, size, t0) {
  const sec = Math.max((Date.now() - t0) / 1000, 0.001), speed = done / sec;
  const left = speed > 0 ? (size - done) / speed : 0;
  const eta = left > 3600 ? `${(left / 3600).toFixed(1)} 小时` : left > 60 ? `${Math.ceil(left / 60)} 分钟` : `${Math.ceil(left)} 秒`;
  const pct = Math.min(100, done / size * 100);
  $('prog').hidden = false; $('prog').value = pct;
  $('status').textContent = `${label}${name}：${pct.toFixed(1)}%（${fmtS(done)} / ${fmtS(size)}，${fmtS(speed)}/秒，剩余约 ${eta}）`;
}

// 大文件分片上传：每片 20MB，逐片发送，失败自动重试 3 次
const CHUNK = 20 * 1024 * 1024;
async function uploadBig(f, folder, label) {
  const json = obj => ({ method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(obj) });
  const s = await api('/api/upload/start', json({ name: f.name, type: f.type, size: f.size, folder }));
  const q = `id=${s.id}&uploadId=${encodeURIComponent(s.uploadId)}`;
  const total = Math.ceil(f.size / CHUNK), parts = [], t0 = Date.now();
  try {
    for (let i = 0; i < total; i++) {
      const blob = f.slice(i * CHUNK, Math.min(f.size, (i + 1) * CHUNK));
      for (let tryN = 1; ; tryN++) {
        try {
          parts.push(await xhrSend('PUT', `/api/upload/part?${q}&part=${i + 1}`, blob,
            loaded => showProg(label, f.name, i * CHUNK + loaded, f.size, t0)));
          break;
        }
        catch (e) { if (tryN >= 3 || e instanceof Cancelled) throw e; $('status').textContent += `（第 ${i + 1} 片失败，重试 ${tryN}）`; await new Promise(r => setTimeout(r, 1500 * tryN)); }
      }
    }
    $('status').textContent = `${label}${f.name}：正在合并文件…`;
    await api('/api/upload/complete?' + q, json({ parts, folder }));
  } catch (e) {
    api('/api/upload/abort?' + q, { method: 'POST' }).catch(() => {});
    throw e;
  }
}

// items: [{ file, folder }]
async function upload(items) {
  items = items.filter(it => !/^\./.test(it.file.name));   // 跳过 .DS_Store 这类隐藏文件
  let ok = 0, n = 0;
  cancelled = false;
  $('cancelUp').hidden = false;
  for (const { file: f, folder } of items) {
    if (cancelled) break;
    n++;
    const label = items.length > 1 ? `上传中（${n}/${items.length}）` : '上传中：';
    if (f.size > maxFile) {
      if (!maxBig) { $('status').textContent = `✘ ${f.name} 超过 ${maxFile / 1048576}MB`; continue; }
      if (!adminKey) { $('status').textContent = `✘ ${f.name} 超过 ${maxFile / 1048576}MB，大文件需要先点右上角“管理”输入密钥`; continue; }
      if (f.size > maxBig) { $('status').textContent = `✘ ${f.name} 超过 ${maxBig / 1073741824}GB`; continue; }
      try { await uploadBig(f, folder, label); ok++; }
      catch (e) { $('status').textContent = `✘ ${f.name}：${e.message}`; await new Promise(r => setTimeout(r, 2000)); }
      continue;
    }
    $('status').textContent = `${label}${f.name} …`;
    const fd = new FormData(); fd.append('file', f); fd.append('folder', folder);
    const t0 = Date.now();
    try { await xhrSend('POST', '/api/files', fd, loaded => showProg(label, f.name, Math.min(loaded, f.size), f.size, t0)); ok++; }
    catch (e) { $('status').textContent = `✘ ${f.name}：${e.message}`; }
  }
  $('prog').hidden = true;
  $('cancelUp').hidden = true;
  curXhr = null;
  if (cancelled) { $('status').textContent = `⏹ 已取消上传（完成 ${ok} 个，共 ${items.length} 个）`; reload(); return; }
  if (items.length && ok === items.length) $('status').textContent = `✔ 已上传 ${ok} 个文件`;
  else if (items.length > 1) $('status').textContent = `已上传 ${ok}/${items.length} 个，失败 ${items.length - ok} 个。最后一个错误：${$('status').textContent.replace(/^✘ /, '')}`;
  reload();
}

// 选择文件 → 传到当前文件夹
$('drop').onclick = () => $('fi').click();
$('fi').onchange = e => { upload([...e.target.files].map(file => ({ file, folder: curDir() }))); e.target.value = ''; };

// 选择整个文件夹 → 以该文件夹名新建并上传（子文件夹里的文件也放进去）
$('upDir').onclick = () => $('fd').click();
$('fd').onchange = e => {
  const items = [...e.target.files].map(file => ({ file, folder: cleanName((file.webkitRelativePath || '').split('/')[0]) }));
  e.target.value = '';
  if (items.length && confirm(`上传文件夹「${items[0].folder}」，共 ${items.length} 个文件？`)) upload(items);
};

// 拖拽：可以拖文件，也可以直接拖文件夹
async function readEntry(entry, folder, out) {
  if (entry.isFile) {
    out.push({ file: await new Promise((ok, no) => entry.file(ok, no)), folder });
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    let batch;
    do {
      batch = await new Promise((ok, no) => reader.readEntries(ok, no));
      for (const e of batch) await readEntry(e, folder, out);
    } while (batch.length);
  }
}
$('drop').ondragover = e => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = async e => {
  e.preventDefault(); $('drop').classList.remove('over');
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!entries.length) return upload([...e.dataTransfer.files].map(file => ({ file, folder: curDir() })));
  const out = [];
  for (const en of entries) await readEntry(en, en.isDirectory && !curDir() ? cleanName(en.name) : curDir(), out);
  upload(out);
};

// 读取后端用的存储（R2 或 KV）和单文件上限
